allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")
}

// AGP 8 requires a namespace on every Android module, but some older
// Flutter plugins (e.g. notification_listener_service 0.3.3) omit it.
// Derive it from the module's manifest package attribute when missing.
gradle.beforeProject { p ->
    p.afterEvaluate { proj ->
        if (proj.plugins.hasPlugin("com.android.library") || proj.plugins.hasPlugin("com.android.application")) {
            // AGP 8 requires a namespace on every Android module, but some older
            // Flutter plugins omit it. Derive it from the module's manifest.
            if (proj.android.namespace == null) {
                def manifestFile = file("${proj.projectDir}/src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def pkg = new XmlSlurper().parse(manifestFile).@package.text()
                    if (pkg) {
                        proj.android.namespace = pkg
                    }
                }
            }
            // Some plugins pin an old compileSdk, which newer androidx
            // transitive deps reject; force compileSdk 36 everywhere.
            if (proj.android.hasProperty("compileSdkVersion")) {
                proj.android.compileSdkVersion = 36
            } else {
                proj.android.compileSdk = 36
            }
        }
    }
    // Kotlin 2.x defaults Kotlin jvmTarget to the running JDK (21), while older
    // plugins set Java compatibility to 1.8. Align both on 17 at the task level
    // (the compileOptions extension is locked before afterEvaluate).
    p.tasks.withType(JavaCompile).configureEach { t ->
        t.sourceCompatibility = JavaVersion.VERSION_17
        t.targetCompatibility = JavaVersion.VERSION_17
    }
    p.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { t ->
        if (t.hasProperty("compilerOptions")) {
            t.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        } else {
            t.kotlinOptions.jvmTarget = "17"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
